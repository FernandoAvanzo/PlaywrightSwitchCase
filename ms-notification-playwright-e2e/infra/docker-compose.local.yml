name: ms-notification-playwright-local

services:
  mysql:
    image: mysql:8.4
    container_name: ms-notification-mysql
    command: ["--mysql-native-password=ON"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-notification}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-notification}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-notification}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    container_name: ms-notification-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init/ready.d:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  tls-certs:
    image: eclipse-temurin:11-jdk-alpine
    container_name: ms-notification-tls-certs
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ ! -f /certs/wiremock-keystore.p12 ]; then
          keytool -genkeypair -noprompt \
            -alias wiremock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=wiremock, OU=E2E, O=Ultragaz, L=Sao Paulo, ST=SP, C=BR" \
            -ext "SAN=dns:wiremock,dns:localhost,ip:127.0.0.1" \
            -storetype PKCS12 \
            -keystore /certs/wiremock-keystore.p12 \
            -storepass changeit \
            -keypass changeit
          keytool -exportcert -noprompt \
            -alias wiremock \
            -keystore /certs/wiremock-keystore.p12 \
            -storepass changeit \
            -rfc \
            -file /certs/wiremock.crt
          chmod 0644 /certs/wiremock-keystore.p12 /certs/wiremock.crt
        fi
        if [ ! -f /certs/wiremock-truststore.jks ]; then
          keytool -importcert -noprompt \
            -alias wiremock \
            -file /certs/wiremock.crt \
            -storetype JKS \
            -keystore /certs/wiremock-truststore.jks \
            -storepass changeit
          chmod 0644 /certs/wiremock-truststore.jks
        fi
    volumes:
      - wiremock-tls:/certs

  wiremock:
    image: wiremock/wiremock:3.9.2
    container_name: ms-notification-wiremock
    command:
      - "--verbose"
      - "--global-response-templating"
      - "--https-port"
      - "8443"
      - "--https-keystore"
      - "/certs/wiremock-keystore.p12"
      - "--keystore-type"
      - "PKCS12"
      - "--keystore-password"
      - "changeit"
      - "--key-manager-password"
      - "changeit"
    ports:
      - "18089:8080"
      - "18443:8443"
    depends_on:
      tls-certs:
        condition: service_completed_successfully
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
      - wiremock-tls:/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/__admin/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  ms-notification: &ms-notification-base
    container_name: ms-notification-app
    build:
      context: ${MS_NOTIFICATION_SOURCE_DIR:-../ms-notification}
      dockerfile: Dockerfile
    ports:
      - "${MS_NOTIFICATION_PORT:-18001}:${MS_NOTIFICATION_CONTAINER_PORT:-8080}"
    depends_on:
      mysql:
        condition: service_healthy
      localstack:
        condition: service_healthy
      wiremock:
        condition: service_healthy
    volumes:
      - wiremock-tls:/certs:ro
    environment: &ms-notification-environment
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${MS_NOTIFICATION_CONTAINER_PORT:-8080}
      SERVER_SERVLET_CONTEXT_PATH: /notification/v1
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-notification}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-notification}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-notification}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-none}
      SPRING_FLYWAY_ENABLED: "true"
      FLYWAY_ENABLED: "true"

      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT: http://localstack:4566
      AWS_SQS_ENDPOINT: http://localstack:4566
      CLOUD_AWS_SQS_ENDPOINT: http://localstack:4566
      CLOUD_AWS_REGION_STATIC: ${AWS_REGION:-us-east-1}

      SQS_SMS_RETRY_QUEUE: ${SQS_SMS_RETRY_QUEUE:-ms-notification-sms-retry}
      SQS_SMS_HOSPITAL_QUEUE: ${SQS_SMS_HOSPITAL_QUEUE:-ms-notification-sms-hospital}
      SQS_WHATSAPP_RETRY_QUEUE: ${SQS_WHATSAPP_RETRY_QUEUE:-ms-notification-whatsapp-retry}
      SQS_WHATSAPP_HOSPITAL_QUEUE: ${SQS_WHATSAPP_HOSPITAL_QUEUE:-ms-notification-whatsapp-hospital}
      SQS_ROUTEASY_HOSPITAL_QUEUE: ${SQS_ROUTEASY_HOSPITAL_QUEUE:-ms-notification-routeasy-hospital}
      SQS_NOTIFICATION_RETRY_QUEUE: ${SQS_NOTIFICATION_RETRY_QUEUE:-ms-notification-notification-retry}
      NOTIFICATION_QUEUE_RETRY: http://localstack:4566/000000000000/${SQS_SMS_RETRY_QUEUE:-ms-notification-sms-retry}
      NOTIFICATION_QUEUE_HOSPITAL: http://localstack:4566/000000000000/${SQS_SMS_HOSPITAL_QUEUE:-ms-notification-sms-hospital}
      NOTIFICATION_QUEUE_WHATSAPP_RETRY: http://localstack:4566/000000000000/${SQS_WHATSAPP_RETRY_QUEUE:-ms-notification-whatsapp-retry}
      NOTIFICATION_QUEUE_WHATSAPP_HOSPITAL: http://localstack:4566/000000000000/${SQS_WHATSAPP_HOSPITAL_QUEUE:-ms-notification-whatsapp-hospital}
      NOTIFICATION_WHATSAPP_QUEUE_RETRY: http://localstack:4566/000000000000/${SQS_WHATSAPP_RETRY_QUEUE:-ms-notification-whatsapp-retry}
      NOTIFICATION_WHATSAPP_QUEUE_HOSPITAL: http://localstack:4566/000000000000/${SQS_WHATSAPP_HOSPITAL_QUEUE:-ms-notification-whatsapp-hospital}

      SMS_PROVIDER_BASE_URL: ${SMS_PROVIDER_BASE_URL:-http://wiremock:8080/sms-provider}
      SMS_BASE_URL: ${SMS_PROVIDER_BASE_URL:-http://wiremock:8080/sms-provider}
      NOTIFICATION_SMS_ENDPOINT: ${SMS_PROVIDER_BASE_URL:-http://wiremock:8080/sms-provider}
      INFOBIP_PROVIDER_BASE_URL: ${INFOBIP_PROVIDER_BASE_URL:-http://wiremock:8080/infobip}
      INFOBIP_BASE_URL: ${INFOBIP_PROVIDER_BASE_URL:-http://wiremock:8080/infobip}
      NOTIFICATION_SMS_INFOBIP_ENDPOINT: ${INFOBIP_PROVIDER_BASE_URL:-http://wiremock:8080/infobip}
      WHATSAPP_PROVIDER_BASE_URL: ${WHATSAPP_PROVIDER_BASE_URL:-http://wiremock:8080/whatsapp-provider}
      WHATSAPP_BASE_URL: ${WHATSAPP_PROVIDER_BASE_URL:-http://wiremock:8080/whatsapp-provider}
      NOTIFICATION_WHATSAPP_ENDPOINT: ${WHATSAPP_PROVIDER_BASE_URL:-http://wiremock:8080/whatsapp-provider}
      BLIP_PROVIDER_BASE_URL: ${BLIP_PROVIDER_BASE_URL:-http://wiremock:8080}
      NOTIFICATION_WHATSAPP_PROVIDER: BLIP
      NOTIFICATION_WHATSAPP_COMMANDS_ENDPOINT: ${BLIP_PROVIDER_BASE_URL:-http://wiremock:8080}/commands
      NOTIFICATION_WHATSAPP_MESSAGES_ENDPOINT: ${BLIP_PROVIDER_BASE_URL:-http://wiremock:8080}/messages
      NOTIFICATION_WHATSAPP_CONTRACT_ID: ${WHATSAPP_CONTRACT_ID:-local-blip-contract}
      NOTIFICATION_WHATSAPP_API_KEY: ${WHATSAPP_API_KEY:-local-blip-api-key}
      NOTIFICATION_WHATSAPP_TEMPLATE_NAMESPACE: ${WHATSAPP_TEMPLATE_NAMESPACE:-local-template-namespace}
      NOTIFICATION_WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-vale_gas_codigo_venda}
      NOTIFICATION_WHATSAPP_TEMPLATE_SELL_NAME: ${WHATSAPP_TEMPLATE_NAME:-vale_gas_codigo_venda}
      NOTIFICATION_WHATSAPP_TEMPLATE_SELL_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-pt_BR}
      NOTIFICATION_WHATSAPP_VOUCHERS_CONTRACT_ID: ${WHATSAPP_CONTRACT_ID:-local-blip-contract}
      NOTIFICATION_WHATSAPP_VOUCHERS_API_KEY: ${WHATSAPP_API_KEY:-local-blip-api-key}
      NOTIFICATION_WHATSAPP_VOUCHERS_TEMPLATE_NAMESPACE: ${WHATSAPP_TEMPLATE_NAMESPACE:-local-template-namespace}
      NOTIFICATION_WHATSAPP_VOUCHERS_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-vale_gas_codigo_venda}
      NOTIFICATION_WHATSAPP_VOUCHERS_FROM: "5511999999999"
      NOTIFICATION_WHATSAPP_VOUCHERS_PROVIDER_CONFIG_ID: local-blip-contract
      SHORTENER_BASE_URL: ${SHORTENER_BASE_URL:-http://wiremock:8080/shortener}
      FIREBASE_DYNAMIC_LINKS_BASE_URL: ${FIREBASE_DYNAMIC_LINKS_BASE_URL:-http://wiremock:8080/firebase}
      FIREBASE_URL_SHORT: ${FIREBASE_DYNAMIC_LINKS_BASE_URL:-http://wiremock:8080/firebase}
      FIREBASE_API_KEY: local

      CREDENTIALS_ALIAS_DEFAULT: ${CREDENTIALS_ALIAS_DEFAULT:-default}
      CREDENTIALS_ALIAS_VOUCHERS: ${CREDENTIALS_ALIAS_VOUCHERS:-vouchers}
      SMS_DEFAULT_USERNAME: ${SMS_DEFAULT_USERNAME:-local-sms-user}
      SMS_DEFAULT_PASSWORD: ${SMS_DEFAULT_PASSWORD:-local-sms-pass}
      NOTIFICATION_SMS_DEFAULT_CREDENTIALS_ACCOUNT_ID: ${SMS_DEFAULT_USERNAME:-local-sms-user}
      NOTIFICATION_SMS_DEFAULT_CREDENTIALS_PASSWORD: ${SMS_DEFAULT_PASSWORD:-local-sms-pass}
      NOTIFICATION_SMS_DEFAULT_CREDENTIALS_CALLBACK_OPTION: NONE
      NOTIFICATION_SMS_DEFAULT_CREDENTIALS_AGGREGATE_ID: "1111"
      NOTIFICATION_SMS_DEFAULT_CREDENTIALS_FROM: Ultragaz
      NOTIFICATION_SMS_CREDENTIALS_ALIASES_VOUCHERS_ACCOUNT_ID: ${SMS_DEFAULT_USERNAME:-local-sms-user}
      NOTIFICATION_SMS_CREDENTIALS_ALIASES_VOUCHERS_PASSWORD: ${SMS_DEFAULT_PASSWORD:-local-sms-pass}
      NOTIFICATION_SMS_CREDENTIALS_ALIASES_VOUCHERS_CALLBACK_OPTION: NONE
      NOTIFICATION_SMS_CREDENTIALS_ALIASES_VOUCHERS_AGGREGATE_ID: "1111"
      NOTIFICATION_SMS_CREDENTIALS_ALIASES_VOUCHERS_FROM: Ultragaz
      NOTIFICATION_SMS_ACCOUNT_ID_ROUTEASY: ${SMS_DEFAULT_USERNAME:-local-sms-user}
      NOTIFICATION_SMS_PASSWORD_ROUTEASY: ${SMS_DEFAULT_PASSWORD:-local-sms-pass}
      NOTIFICATION_SMS_AGGREGATE_ID_ROUTEASY: "1111"
      NOTIFICATION_SMS_INFOBIP_API_KEY: local-infobip-api-key
      NOTIFICATION_SMS_INFOBIP_SENDER: Ultragaz
      WHATSAPP_DEFAULT_USERNAME: ${WHATSAPP_DEFAULT_USERNAME:-local-whatsapp-user}
      WHATSAPP_DEFAULT_PASSWORD: ${WHATSAPP_DEFAULT_PASSWORD:-local-whatsapp-pass}
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_ACCOUNT_ID: ${WHATSAPP_DEFAULT_USERNAME:-local-whatsapp-user}
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_CONTRACT_ID: ${WHATSAPP_CONTRACT_ID:-local-blip-contract}
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_API_KEY: ${WHATSAPP_API_KEY:-local-blip-api-key}
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_TEMPLATE_NAMESPACE: ${WHATSAPP_TEMPLATE_NAMESPACE:-local-template-namespace}
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_FROM: "5511999999999"
      NOTIFICATION_WHATSAPP_DEFAULT_CREDENTIALS_PROVIDER_CONFIG_ID: local-provider-config
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_ACCOUNT_ID: ${WHATSAPP_DEFAULT_USERNAME:-local-whatsapp-user}
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_CONTRACT_ID: ${WHATSAPP_CONTRACT_ID:-local-blip-contract}
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_API_KEY: ${WHATSAPP_API_KEY:-local-blip-api-key}
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_TEMPLATE_NAMESPACE: ${WHATSAPP_TEMPLATE_NAMESPACE:-local-template-namespace}
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-vale_gas_codigo_venda}
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_FROM: "5511999999999"
      NOTIFICATION_WHATSAPP_CREDENTIALS_ALIASES_VOUCHERS_PROVIDER_CONFIG_ID: local-provider-config
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:${MS_NOTIFICATION_CONTAINER_PORT:-8080}/notification/v1/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 30

  ms-notification-salesforce:
    <<: *ms-notification-base
    container_name: ms-notification-salesforce-app
    ports:
      - "${SALESFORCE_MS_NOTIFICATION_PORT:-18002}:${MS_NOTIFICATION_CONTAINER_PORT:-8080}"
    environment:
      <<: *ms-notification-environment
      NOTIFICATION_WHATSAPP_PROVIDER: SALESFORCE
      SALESFORCE_LOGIN_URL: https://wiremock:8443/services/oauth2/token
      SALESFORCE_CLIENT_ID: local-salesforce-client
      SALESFORCE_CLIENT_SECRET: local-salesforce-secret
      SALESFORCE_APP_AUTH_PATH: /services/apexrest/messaging/appAuth
      SALESFORCE_VOUCHER_PATH: /services/apexrest/messaging/voucher
      SALESFORCE_TOKEN_CACHE_TTL_SECONDS: "1800"
      SALESFORCE_TOKEN_REFRESH_SKEW_SECONDS: "60"
      SALESFORCE_CONNECT_TIMEOUT_MILLIS: "500"
      SALESFORCE_READ_TIMEOUT_MILLIS: "500"
      JAVA_TOOL_OPTIONS: >-
        -Djavax.net.ssl.trustStore=/certs/wiremock-truststore.jks
        -Djavax.net.ssl.trustStorePassword=changeit
        -Djavax.net.ssl.trustStoreType=JKS

  playwright:
    image: mcr.microsoft.com/playwright:v1.54.0-noble
    profiles: ["test"]
    working_dir: /work
    volumes:
      - ..:/work
    environment:
      TEST_ENV: local
      MS_NOTIFICATION_BASE_URL: http://ms-notification:${MS_NOTIFICATION_CONTAINER_PORT:-8080}/notification/v1
      SALESFORCE_MS_NOTIFICATION_BASE_URL: http://ms-notification-salesforce:${MS_NOTIFICATION_CONTAINER_PORT:-8080}/notification/v1
      MOCK_BASE_URL: http://wiremock:8080
      AWS_ENDPOINT: http://localstack:4566
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      CLIENT_ID: ${CLIENT_ID:-client-test-001}
    depends_on:
      ms-notification:
        condition: service_healthy
      ms-notification-salesforce:
        condition: service_healthy
    command: ["bash", "-lc", "npm ci || npm install && npx playwright test --grep '@(smoke|contract|local|e2e)'"]

volumes:
  mysql-data:
  localstack-data:
  wiremock-tls:
