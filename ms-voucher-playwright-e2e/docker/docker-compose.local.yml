services:
  mysql:
    image: mysql:8.4
    container_name: ms-voucher-mysql
    command: --default-authentication-plugin=mysql_native_password --sql-mode=""
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms_voucher
      MYSQL_USER: ms_voucher
      MYSQL_PASSWORD: ms_voucher
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: ms-voucher-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:latest
    container_name: ms-voucher-localstack
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: sa-east-1
      EDGE_PORT: 4566
      DEBUG: "0"
    ports:
      - "4566:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -E 'sqs|s3'"]
      interval: 10s
      timeout: 5s
      retries: 30

  ms-notification-wiremock:
    image: wiremock/wiremock:latest
    container_name: ms-notification-wiremock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "18081:8080"
    volumes:
      - ./wiremock/ms-notification:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/mappings >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  soa-wiremock:
    image: wiremock/wiremock:latest
    container_name: ms-voucher-soa-wiremock
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "18082:8080"
    volumes:
      - ./wiremock/soa:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/__admin/mappings >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: ms-voucher-oracle
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: voucher
      APP_USER_PASSWORD: voucher
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30

  ms-voucher:
    container_name: ms-voucher-app
    profiles: ["app"]
    build:
      context: ${MS_VOUCHER_PROJECT_DIR:-../../ms-voucher}
      dockerfile: ${MS_VOUCHER_DOCKERFILE:-Dockerfile}
    env_file:
      - ./env/ms-voucher.local.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/ms_voucher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: ms_voucher
      SPRING_DATASOURCE_PASSWORD: ms_voucher
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: sa-east-1
      MS_NOTIFICATION_ENDPOINT: http://ms-notification-wiremock:8080/notification/v1
      SOA_ENDPOINT: http://soa-wiremock:8080/soa
      SERVER_PORT: "8001"
      SERVER_SERVLET_CONTEXT_PATH: /voucher/v1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      ms-notification-wiremock:
        condition: service_healthy
      soa-wiremock:
        condition: service_healthy
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/voucher/v1/actuator/health || curl -sf http://localhost:8001/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 40

volumes:
  mysql-data:
  oracle-data:
  localstack-data:
