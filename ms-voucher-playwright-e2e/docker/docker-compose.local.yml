name: ${COMPOSE_PROJECT_NAME:-ms-voucher-playwright-local}

services:
  mysql:
    image: mysql:8.4
    command: ["--mysql-native-password=ON", "--lower-case-table-names=1", "--max_allowed_packet=100000000", "--character-set-server=latin1", "--collation-server=latin1_swedish_ci", "--sql-mode="]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ms_voucher
      MYSQL_USER: ms_voucher
      MYSQL_PASSWORD: ms_voucher
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 10s
      timeout: 5s
      retries: 20

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: sa-east-1
      GATEWAY_LISTEN: 0.0.0.0:4566
      DEBUG: "0"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -E 'sqs|s3'"]
      interval: 10s
      timeout: 5s
      retries: 30

  ms-notification-wiremock:
    image: wiremock/wiremock:latest
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${NOTIFICATION_WIREMOCK_PORT:-18081}:8080"
    volumes:
      - ./wiremock/ms-notification:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/__admin/mappings >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  soa-wiremock:
    image: wiremock/wiremock:latest
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${SOA_WIREMOCK_PORT:-18082}:8080"
    volumes:
      - ./wiremock/soa:/home/wiremock:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/__admin/mappings >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ["oracle"]
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: voucher
      APP_USER_PASSWORD: voucher
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30

  ms-voucher:
    profiles: ["app"]
    build:
      context: ${MS_VOUCHER_PROJECT_DIR:-../../../ms-voucher}
      dockerfile: ${MS_VOUCHER_DOCKERFILE:-Dockerfile}
    env_file:
      - ./env/ms-voucher.local.env
    volumes:
      - ./ms-voucher-migrations:/opt/ms-voucher-local-migrations:ro
    environment:
      SPRING_DATASOURCE_PRIMARY_URL: jdbc:mysql://mysql:3306/ms_voucher?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_PRIMARY_USERNAME: ms_voucher
      SPRING_DATASOURCE_PRIMARY_PASSWORD: ms_voucher
      SPRING_DATASOURCE_PRIMARY_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_IS_STAND_ALONE: "true"
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_REGION: sa-east-1
      NOTIFICATION_ENDPOINT: http://ms-notification-wiremock:8080/notification/v1
      TRANSACTION_INTEGRATIONS_SOAP_ENDPOINT: http://soa-wiremock:8080/soa
      EVENT_LISTENERS_ENABLED: "false"
      MANAGEMENT_HEALTH_DB_ENABLED: "false"
      SERVER_PORT: "8001"
      SERVER_SERVLET_CONTEXT_PATH: /voucher/v1
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      ms-notification-wiremock:
        condition: service_healthy
      soa-wiremock:
        condition: service_healthy
    ports:
      - "${MS_VOUCHER_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8001/voucher/v1/actuator/health >/dev/null 2>&1 || wget -q -O- http://localhost:8001/actuator/health >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 40

volumes:
  mysql-data:
  oracle-data:
  localstack-data:
